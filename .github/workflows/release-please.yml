name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release

  # Ten job wykona się TYLKO po zmerge'owaniu Release PR
  publish-npm:
    needs: create-release
    if: ${{ needs.create-release.outputs.release_created }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          # registry-url removed - not needed for Trusted Publishers with OIDC
          # Removing this prevents actions/setup-node from adding deprecated
          # 'always-auth=true' to .npmrc (causes warnings in npm 11+)

      - name: Install latest npm
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run tests
        run: npm run test:run

      - name: Type check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      - name: Build package
        run: npm run prepack

      - name: Validate package
        run: npm run publint

      - name: Verify npm >= 11.5.1 for Trusted Publishers
        run: |
          CURRENT_NPM=$(npm --version)
          echo "Current npm version: $CURRENT_NPM"
          if [ "$(printf '%s\n' "11.5.1" "$CURRENT_NPM" | sort -V | head -n1)" = "11.5.1" ]; then
            echo "✓ npm version $CURRENT_NPM is sufficient (>= 11.5.1)"
          else
            echo "❌ Error: npm version $CURRENT_NPM is too old"
            echo "npm >= 11.5.1 is required for Trusted Publishers"
            echo "Update Node.js version in workflow or manually install newer npm"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Log release info
        run: |
          echo "✅ Successfully published version ${{ needs.create-release.outputs.version }}"
          echo "📦 Package: @gander-tools/playground@${{ needs.create-release.outputs.version }}"
          echo "🏷️  Tag: ${{ needs.create-release.outputs.tag_name }}"

  # Publikacja do JSR po pomyślnej publikacji do npm
  publish-jsr:
    needs: [create-release, publish-npm]
    if: ${{ needs.create-release.outputs.release_created }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: deno install --no-lock --allow-scripts

      - name: Publish to JSR
        run: deno publish

      - name: Log JSR release info
        run: |
          echo "✅ Successfully published to JSR"
          echo "📦 Version: ${{ needs.create-release.outputs.version }}"
