name: Test & Build

on:
    workflow_dispatch:
    pull_request:
        branches:
            - master
    push:
        branches:
            - master

permissions:
    contents: read

jobs:
    # Detect which files changed
    changes:
        name: Detect Changes
        if: github.event_name != 'workflow_dispatch'
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            src: ${{ steps.filter.outputs.src }}
            tests: ${{ steps.filter.outputs.tests }}
            config: ${{ steps.filter.outputs.config }}
            workflows: ${{ steps.filter.outputs.workflows }}
        steps:
            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Check for file changes
                uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
                id: filter
                with:
                    filters: |
                        src:
                          - 'src/**'
                          - 'package.json'
                        tests:
                          - 'test/**'
                        config:
                          - 'tsconfig.json'
                          - 'biome.json'
                          - 'commitlint.config.js'
                        workflows:
                          - '.github/workflows/**'

    test-and-build:
        name: Test & Build
        runs-on: ubuntu-26.04
        needs: changes
        # Run if source, tests, or config changed
        if: |
            !cancelled() && (needs.changes.outputs.src == 'true' ||
            needs.changes.outputs.tests == 'true' ||
            needs.changes.outputs.config == 'true' ||
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch')
        steps:
            -   name: Harden Runner
                uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
                with:
                    disable-sudo: true
                    egress-policy: audit

            -   name: Checkout code
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            -   name: Setup Node.js
                uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
                with:
                    node-version: "24"

            -   name: Install dependencies
                run: npm install --ignore-scripts

            -   name: Run type check
                run: npm run typecheck

            -   name: Run linter
                run: npm run lint

            -   name: Run unit tests
                run: npm run test:run

            -   name: Run build test
                run: npm run test:run test/build.test.ts
