name: Format Release PR Files

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  format-files:
    # Only run on Release Please PRs
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run check:fix to format files
        run: npm run check:fix

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push formatted files
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: format release files with biome"
          git push

      - name: Log completion
        if: steps.git-check.outputs.has_changes == 'true'
        run: echo "✅ Release PR files have been formatted"

      - name: Log no changes
        if: steps.git-check.outputs.has_changes != 'true'
        run: echo "✅ No formatting changes needed"
